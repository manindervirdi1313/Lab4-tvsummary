
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvsummary"
version = "1.0.0"
description = "A modular TVMaze show summary application"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]